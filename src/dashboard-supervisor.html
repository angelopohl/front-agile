<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supervisor - Asignación de Tareas</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon" />
  </head>
  <body class="dashboard-layout">
    <header class="header"></header>

    <main class="main-content container">
      <h1>Bienvenido(a) Supervisor</h1>

      <section
        id="indicators"
        class="indicators-grid"
        aria-label="Indicadores de reportes"
      >
        <div class="indicator-card">
          <h4>Total de reportes</h4>
          <p id="total-count">—</p>
        </div>
        <div class="indicator-card">
          <h4>Pendientes</h4>
          <p id="pending-count">—</p>
        </div>
        <div class="indicator-card">
          <h4>Resueltos</h4>
          <p id="resolved-count">—</p>
        </div>
        <div class="indicator-card">
          <h4>Barrido</h4>
          <p id="type-barrido-count">—</p>
        </div>
        <div class="indicator-card">
          <h4>Maleza</h4>
          <p id="type-maleza-count">—</p>
        </div>
        <div class="indicator-card">
          <h4>Residuos Sólidos</h4>
          <p id="type-residuos-count">—</p>
        </div>
      </section>
      <div class="reports-section">
        <div
          id="dashboard-feedback"
          class="feedback-message"
          style="display: none"
        ></div>

        <h3>Reportes</h3>

        <section class="filter-bar">
          <form id="filter-form" class="filter-form-horizontal">
            <div class="filter-group-horizontal">
              <label class="group-label">Estado</label>
              <div class="filter-options-inline">
                <div class="filter-option">
                  <input
                    type="checkbox"
                    id="filter-state-pending"
                    name="state"
                    value="PENDIENTE"
                    checked
                  />
                  <label for="filter-state-pending">Pendiente</label>
                </div>
                <div class="filter-option">
                  <input
                    type="checkbox"
                    id="filter-state-resolved"
                    name="state"
                    value="RESUELTO"
                  />
                  <label for="filter-state-resolved">Resuelto</label>
                </div>
              </div>
            </div>

            <div class="filter-group-horizontal">
              <label class="group-label">Tipo de Reporte</label>
              <div class="filter-options-inline">
                <div class="filter-option">
                  <input
                    type="checkbox"
                    id="filter-type-barrido"
                    name="type"
                    value="BARRIDO"
                  />
                  <label for="filter-type-barrido">Barrido</label>
                </div>
                <div class="filter-option">
                  <input
                    type="checkbox"
                    id="filter-type-maleza"
                    name="type"
                    value="MALEZA"
                  />
                  <label for="filter-type-maleza">Maleza</label>
                </div>
                <div class="filter-option">
                  <input
                    type="checkbox"
                    id="filter-type-residuos"
                    name="type"
                    value="RESIDUOS_SOLIDOS"
                  />
                  <label for="filter-type-residuos">R. Sólidos</label>
                </div>
              </div>
            </div>

            <div class="filter-group-horizontal">
              <label class="group-label">Fecha de Creación</label>
              <div class="filter-date-range-inline">
                <div class="filter-date-group">
                  <label for="filter-date-start">Desde:</label>
                  <input type="date" id="filter-date-start" name="date_start" />
                </div>
                <div class="filter-date-group">
                  <label for="filter-date-end">Hasta:</label>
                  <input type="date" id="filter-date-end" name="date_end" />
                </div>
              </div>
            </div>

            <div class="filter-actions-horizontal">
              <button type="submit" class="btn-primary">Aplicar</button>
              <button type="reset" class="btn-secondary">Limpiar</button>
            </div>
          </form>
        </section>
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo de Reporte</th>
                <th>Ubicación</th>
                <th>Foto</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="reports-table-body">
              <tr>
                <td colspan="4" style="text-align: center">
                  Cargando reportes pendientes...
                </td>
              </tr>
            </tbody>
          </table>

          <div
            id="no-reports-message"
            class="empty-state-message"
            style="display: none"
          >
            No se encontraron reportes con los criterios aplicados.
          </div>
        </div>

        <div class="pagination-controls">
          <button id="prev-page" class="btn-primary">Anterior</button>
          <span id="page-info">Página 1 de 1</span>
          <button id="next-page" class="btn-primary">Siguiente</button>
        </div>
      </div>
    </main>

    <div id="assign-report-modal" class="modal"></div>
  </body>
</html>
